# Xiaomi 13T pilot configuration.
# Synthetic mode runs today. Real sections remain placeholders until an
# explicitly configured trainer/attack/baseline harness is provisioned.

seed: 42
output_dir: outputs/pilot_xiaomi13t
mode: synthetic_pilot

data:
  root: null
  dataset: synthetic_pilot
  # Replace with a normalized poisonguard_events.jsonl root for real runs.

model:
  backend: deterministic_vector_reference
  dimension: 8
  clip_norm: 1.0
  real_model_dir: /sdcard/Android/data/com.poisonguard/files/models/Qwen2.5-0.5B
  real_backend: mobilefinetuner
  lora_rank: 4
  sequence_length: 8
  batch_size: 1

training:
  step_size: 0.1
  max_steps: 20

audit:
  max_behavior_score: 2.0
  max_update_norm: 2.0

calibration:
  quantile: 0.95

synthetic:
  benign_count: 20
  poison_count: 4

policy:
  typed_training: allow
  remote_memory: quarantine
  remote_training: deny

device:
  name: Xiaomi 13T
  model: 2306EPN60G
  device_id: 9DBQFE8LEEWWYHYD
  soc: MediaTek Dimensity 8200-Ultra (mt6895)
  os: Android 16 (BP2A.250605.031.A3)
  abi: arm64-v8a
  backend: MobileFineTuner native
  thermal_policy: uncontrolled; record per-run skin/SOC temperature
  charging: USB powered; charging policy not controlled
  energy_monitor: external power monitor required

real_pilot:
  trainer_binary: fill after Android service deployment
  channels:
    - typed
    - notification
  attack_families:
    - memory_retrieval
    - lora_data_poisoning
  seeds: 3
  metrics:
    - training_step_ms
    - peak_rss_mb
    - temperature_c
    - battery_energy_j
    - job_completion
  # Measured but not a paper result:
  # outputs/qwen_step_pilot_3seed/qwen_step_pilot.json
  # It uses synthetic token ids, sequence length 8, and batch size 1.
