[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poisonguard"
version = "0.1.0"
description = "Reference implementation of provenance-carried selection and lineage rollback for on-device personalization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
poisonguard = "poisonguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
